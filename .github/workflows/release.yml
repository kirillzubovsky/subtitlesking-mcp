name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          ext=""
          if [ "$GOOS" = "windows" ]; then ext=".exe"; fi
          out="dist/subtitlesking-mcp${ext}"
          go build -trimpath -ldflags="-s -w -X main.version=${GITHUB_REF_NAME}" -o "$out" .

      - name: Package
        run: |
          cd dist
          base="subtitlesking-mcp-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            mv subtitlesking-mcp.exe "${base}.exe"
            zip "${base}.zip" "${base}.exe" ../README.md ../LICENSE
            rm "${base}.exe"
          else
            mv subtitlesking-mcp "${base}"
            tar -czf "${base}.tar.gz" "${base}" -C .. README.md LICENSE
            rm "${base}"
          fi
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: subtitlesking-mcp-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/subtitlesking-mcp-*

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum subtitlesking-mcp-* > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/subtitlesking-mcp-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
