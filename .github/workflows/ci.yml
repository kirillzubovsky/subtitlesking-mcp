name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true
      - run: go vet ./...
      - run: go build ./...
      - run: |
          # Smoke test: bridge should respond to --version
          go build -o /tmp/subtitlesking-mcp .
          /tmp/subtitlesking-mcp --version
